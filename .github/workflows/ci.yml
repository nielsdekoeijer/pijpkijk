name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v30
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Allow Nix builds on the Ubuntu runner
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Build
        run: nix develop -c bash -c 'export ZIG_GLOBAL_CACHE_DIR=$(mktemp -d) && mkdir -p $ZIG_GLOBAL_CACHE_DIR/tmp && zig build'
