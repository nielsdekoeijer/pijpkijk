name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v30
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Allow Nix builds on the Ubuntu runner
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Build release binary
        run: nix build .#release --print-build-logs

      - name: Verify portable linkage
        run: |
          echo "=== ldd ==="
          ldd result/bin/pijpkijk || true
          echo "=== GLIBC versions required ==="
          objdump -T result/bin/pijpkijk | grep -oP 'GLIBC_\S+' | sort -uV
          echo "=== ELF interpreter ==="
          readelf -l result/bin/pijpkijk | grep interpreter
          echo "=== RUNPATH ==="
          readelf -d result/bin/pijpkijk | grep -i runpath || true
          echo "=== Nix store references ==="
          references="$(nix-store --query --references result)"
          test -z "$references" || { echo "$references"; exit 1; }

      - name: Package binary
        run: |
          mkdir -p release
          cp result/bin/pijpkijk release/
          tar -czf pijpkijk-x86_64-linux.tar.gz -C release pijpkijk

      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch'
        with:
          name: pijpkijk-x86_64-linux
          path: pijpkijk-x86_64-linux.tar.gz

      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: pijpkijk-x86_64-linux.tar.gz
