name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v30
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - run: nix build

      - name: Package binary
        run: |
          mkdir -p release
          cp result/bin/pijpkijk release/
          tar -czf pijpkijk-x86_64-linux.tar.gz -C release pijpkijk

      - uses: softprops/action-gh-release@v2
        with:
          files: pijpkijk-x86_64-linux.tar.gz
