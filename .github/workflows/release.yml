name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v30
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Allow Nix builds on the Ubuntu runner
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Build release binary
        run: nix develop -c bash -c 'export ZIG_GLOBAL_CACHE_DIR=$(mktemp -d) && mkdir -p $ZIG_GLOBAL_CACHE_DIR/tmp && zig build -Doptimize=ReleaseSafe -Dtarget=x86_64-linux-gnu.2.35'

      - name: Patch binary for portability
        run: |
          nix develop -c patchelf \
            --set-interpreter /lib64/ld-linux-x86-64.so.2 \
            --set-rpath "/usr/lib/x86_64-linux-gnu:/usr/lib:/lib" \
            --output zig-out/bin/pijpkijk-patched \
            zig-out/bin/pijpkijk
          mv zig-out/bin/pijpkijk-patched zig-out/bin/pijpkijk

      - name: Verify portable linkage
        run: |
          echo "=== ldd ==="
          ldd zig-out/bin/pijpkijk || true
          echo "=== GLIBC versions required ==="
          objdump -T zig-out/bin/pijpkijk | grep -oP 'GLIBC_\S+' | sort -uV
          echo "=== ELF interpreter ==="
          readelf -l zig-out/bin/pijpkijk | grep interpreter
          echo "=== RUNPATH ==="
          readelf -d zig-out/bin/pijpkijk | grep -i runpath || true

      - name: Package binary
        run: |
          mkdir -p release
          cp zig-out/bin/pijpkijk release/
          tar -czf pijpkijk-x86_64-linux.tar.gz -C release pijpkijk

      - uses: softprops/action-gh-release@v2
        with:
          files: pijpkijk-x86_64-linux.tar.gz
